<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>AkaMidoriAo</title>
    <link rel="icon" type="image/svg+xml" href="palette-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0b0b11;
            --surface: #14141d;
            --surface2: #1c1c28;
            --surface3: #242433;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.14);
            --border-strong: rgba(255,255,255,0.22);
            --text: #f4f4fa;
            --text-muted: #6a6a88;
            --text-subtle: #454562;
            --accent: #8b7aff;
            --accent-hover: #a192ff;
            --accent-glow: rgba(139,122,255,0.35);
            --success: #4ade80;
            --danger: #f87171;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --font-brand: 'Host Grotesk', 'Outfit', sans-serif;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'Space Mono', 'Courier New', monospace;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body, html {
            width: 100%; height: 100%;
            font-family: var(--font-ui);
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-feature-settings: 'ss01', 'cv11';
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Grain subtil pour donner du relief */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ── TOP BAR ── */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 56px;
            background: linear-gradient(180deg, rgba(11,11,17,0.92), rgba(11,11,17,0.82));
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 200;
            gap: 16px;
        }
        .app-title {
            color: var(--text);
            white-space: nowrap;
            display: flex; align-items: baseline; gap: 8px;
        }
        .app-title-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow), 0 0 2px var(--accent);
            align-self: center;
        }
        .app-title-label {
            font-family: var(--font-brand);
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        /* Nom de la palette */
        .palette-name-wrap {
            display: flex; align-items: center; gap: 8px;
            border-left: 1px solid var(--border);
            padding-left: 16px; margin-left: 4px;
        }
        .palette-name-label {
            font-size: 0.62rem; font-weight: 500; color: var(--text-subtle);
            white-space: nowrap; letter-spacing: 0.12em; text-transform: uppercase;
        }
        .palette-name-input {
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font-display);
            font-size: 0.92rem;
            font-weight: 500;
            padding: 4px 8px;
            min-width: 110px; max-width: 230px;
            transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
            outline: none;
            letter-spacing: -0.01em;
        }
        .palette-name-input:hover { border-color: var(--border-hover); background: var(--surface2); }
        .palette-name-input:focus { border-color: var(--accent); background: var(--surface2); }
        .palette-name-input::placeholder { color: var(--text-subtle); opacity: 0.7; }

        .unsaved-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251,191,36,0.55);
            flex-shrink: 0;
            display: none;
            animation: pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.85); }
        }
        .unsaved-dot.visible { display: block; }

        /* Drop overlay */
        .drop-overlay {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(139,122,255,0.12);
            border: 2px dashed var(--accent);
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }
        .drop-overlay.active { display: flex; }
        .drop-overlay-inner { text-align: center; color: var(--text); }
        .drop-overlay-inner svg { opacity: 0.8; margin-bottom: 14px; }
        .drop-overlay-inner p {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .drop-overlay-inner small { color: var(--text-muted); font-size: 0.76rem; letter-spacing: 0.06em; }

        .controls { display: flex; gap: 6px; align-items: center; }

        .btn {
            padding: 7px 13px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-ui);
            font-weight: 500; font-size: 0.76rem;
            cursor: pointer; display: flex; align-items: center; gap: 7px;
            transition: all 0.18s var(--ease); position: relative;
            background: var(--surface); color: var(--text); white-space: nowrap;
            letter-spacing: -0.1px;
        }
        .btn:hover {
            border-color: var(--border-hover);
            background: var(--surface2);
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }
        .btn:active { transform: translateY(0); }
        .btn-accent {
            background: linear-gradient(180deg, var(--accent), #6d5ce0);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .btn-accent:hover {
            background: linear-gradient(180deg, var(--accent-hover), #7d6af0);
            border-color: transparent;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .btn svg { flex-shrink: 0; }
        .btn-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }

        /* ── LAYOUT ── */
        .capture-area {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            padding-top: 56px;
            position: relative;
            z-index: 2;
        }
        .palette-container { width: 100%; flex-grow: 1; display: flex; }

        /* ═══ MODE VERTICAL ═══ */
        .mode-vertical .palette-container { flex-direction: row; }

        .color-column {
            flex: 1; height: 100%;
            display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            padding: 0 12px var(--col-pad-bottom, 72px); text-align: center;
            position: relative; cursor: pointer;
            transition: flex 0.35s var(--ease-out); overflow: hidden;
        }
        .color-column:hover { flex: 1.08; }

        /* Numérotation subtile en haut */
        .color-column::before {
            content: attr(data-num);
            position: absolute;
            top: 18px; left: 18px;
            font-family: var(--font-mono);
            font-size: 0.58rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            opacity: 0.35;
            color: currentColor;
            pointer-events: none;
            z-index: 5;
        }

        .color-info { padding: 12px; width: 100%; max-width: 320px; }

        .color-hex {
            font-family: var(--font-mono);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 1px dashed currentColor;
            display: inline-block; cursor: text; padding: 2px 5px;
            font-size: clamp(0.85rem, 2.1vw, 2rem);
            transition: background 0.2s, border-radius 0.2s;
        }
        .color-hex:focus {
            outline: none;
            border-radius: 4px;
            background: rgba(255,255,255,0.12);
            border-bottom-color: transparent;
        }

        .color-nickname-row {
            display: flex; align-items: center; justify-content: center; gap: 7px;
            min-height: 1.4em;
            margin-top: 7px;
        }
        .color-nickname {
            font-family: var(--font-display);
            font-weight: 500;
            opacity: 0.85;
            pointer-events: none;
            transition: opacity 0.3s;
            font-size: clamp(0.65rem, 1.2vw, 1.02rem);
            display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            letter-spacing: -0.01em;
        }

        .many-colors .color-nickname {
            writing-mode: unset;
            white-space: nowrap; overflow: visible;
        }
        .too-many-colors .color-nickname {
            writing-mode: unset;
            white-space: nowrap; overflow: visible;
            font-size: 0.62rem; opacity: 0.5;
        }
        .too-many-colors .color-hex { font-size: clamp(0.5rem, 0.95vw, 0.9rem); }

        .many-colors .color-column,
        .too-many-colors .color-column {
            align-items: center;
            justify-content: center;
        }
        .many-colors .color-info,
        .too-many-colors .color-info {
            position: absolute;
            top: 50%;
            left: 50%;
            width: calc(100vh - 56px - 20px);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            white-space: nowrap;
            overflow: hidden;
            padding: 0 12px 0 0;
            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
        }
        .many-colors .color-info .color-hex,
        .too-many-colors .color-info .color-hex,
        .many-colors .color-info .color-nickname-row,
        .too-many-colors .color-info .color-nickname-row {
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
        }

        .color-nickname.loading { opacity: 0.3; }

        .color-hex-row {
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .btn-copy-hex-v {
            flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.12); color: inherit;
            opacity: 0; cursor: pointer;
            transition: opacity 0.18s var(--ease), background 0.18s, transform 0.18s;
        }
        .color-column:hover .btn-copy-hex-v { opacity: 0.8; }
        .btn-copy-hex-v:hover { opacity: 1 !important; background: rgba(0,0,0,0.4); transform: scale(1.08); }
        .btn-copy-hex-v.copied { opacity: 1 !important; background: rgba(74,222,128,0.35) !important; border-color: var(--success); }

        .btn-delete-col {
            position: absolute; top: 14px; right: 14px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12);
            width: 28px; height: 28px; border-radius: 50%;
            color: inherit; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s var(--ease), background 0.18s, transform 0.18s;
            z-index: 10;
        }
        .color-column:hover .btn-delete-col { opacity: 0.85; }
        .btn-delete-col:hover {
            opacity: 1 !important;
            background: rgba(248,113,113,0.85) !important;
            border-color: transparent; color:#fff!important;
            transform: scale(1.1);
        }

        /* ═══ MODE HORIZONTAL ═══ */
        .mode-horizontal .palette-container {
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 20px 20px;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface3) transparent;
        }
        .mode-horizontal .palette-container::-webkit-scrollbar { width: 8px; }
        .mode-horizontal .palette-container::-webkit-scrollbar-track { background: transparent; }
        .mode-horizontal .palette-container::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

        .color-row {
            display: flex; align-items: stretch;
            min-height: 78px; position: relative;
            transition: min-height 0.2s var(--ease), transform 0.25s var(--ease);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .color-row:hover {
            min-height: 86px;
            border-color: var(--border-hover);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }

        .row-num {
            display: flex; align-items: center; justify-content: center;
            min-width: 32px;
            background: var(--surface2);
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            color: var(--text-subtle);
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .row-swatch {
            width: 110px; min-width: 110px;
            cursor: pointer; position: relative;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .hex-with-copy {
            display: flex; align-items: center; justify-content: center;
        }
        .row-hex-label {
            font-family: var(--font-mono);
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px;
            text-transform: uppercase;
            pointer-events: none; user-select: none;
        }
        .btn-copy-hex {
            position: absolute;
            bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer; opacity: 0;
            transition: opacity 0.2s var(--ease), background 0.18s, transform 0.18s;
        }
        .color-row:hover .btn-copy-hex { opacity: 0.8; }
        .btn-copy-hex:hover { opacity: 1 !important; background: rgba(0,0,0,0.45); transform: translateX(-50%) scale(1.1); }
        .btn-copy-hex.copied { opacity: 1 !important; background: rgba(74,222,128,0.4) !important; border-color: var(--success); }

        .row-swatch .btn-delete-row {
            position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12);
            width: 24px; height: 24px; border-radius: 50%;
            font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s var(--ease), background 0.18s, transform 0.18s; z-index: 10;
        }
        .color-row:hover .btn-delete-row { opacity: 0.85; }
        .btn-delete-row:hover { background: rgba(248,113,113,0.85) !important; border-color: transparent; color:#fff !important; transform: translateY(-50%) scale(1.1); }

        .row-content {
            flex: 1; display: grid;
            grid-template-columns: var(--col-rgb,130px) var(--col-nom,200px) 1fr;
            min-width: 0;
        }

        .row-cell {
            padding: 14px 18px;
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: center;
            min-width: 0; overflow: hidden;
        }
        .row-cell:last-child { border-right: none; }
        .row-cell-label {
            font-size: 0.56rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.14em; color: var(--text-subtle); margin-bottom: 6px;
            white-space: nowrap;
        }
        .row-cell-value { font-size: 0.84rem; color: var(--text); font-weight: 500; }
        .row-cell-value.mono {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            color: #a8b8ff;
            letter-spacing: 0.3px;
        }

        .row-merged-name {
            font-family: var(--font-display);
            font-size: 0.98rem;
            color: var(--text);
            font-weight: 500;
            cursor: text; outline: none;
            border-bottom: 1px dashed transparent;
            white-space: nowrap; overflow: hidden; min-width: 60px;
            flex-shrink: 1;
            letter-spacing: -0.01em;
            transition: border-color 0.2s;
            padding: 2px 0;
        }
        .row-merged-name.loading { color: var(--text-muted); }
        .row-merged-name.custom { color: var(--accent-hover); }
        .row-merged-name:focus { border-bottom-color: var(--accent); }
        .row-merged-name:empty::before { content: '—'; color: var(--text-subtle); }

        /* ── NOTES : textarea transparent + calque colorisé derrière ── */
        .row-cell.notes-cell { justify-content: flex-start; }
        .notes-wrap { position: relative; flex: 1; min-height: 44px; }
        .notes-layer {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            font-weight: 400;
            line-height: 1.55;
            letter-spacing: 0.01em;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }
        .notes-highlight {
            position: absolute; inset: 0;
            overflow: hidden;
            pointer-events: none;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .notes-wrap:focus-within .notes-highlight { color: var(--text); }
        .row-notes {
            position: absolute; inset: 0;
            background: transparent;
            border: none; outline: none;
            color: transparent;               /* le texte visible vient du calque */
            caret-color: var(--text);
            resize: none;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .row-notes::-webkit-scrollbar { display: none; }
        .row-notes::selection { background: rgba(139,122,255,0.35); color: transparent; }
        .row-notes::placeholder { color: transparent; }
        .row-notes:focus::placeholder { color: var(--text-subtle); }

        /* ── FOOTER ── */
        .branding-footer {
            font-family: var(--font-brand);
            display: none; background: var(--bg); color: var(--text);
            text-align: center; padding: 16px 0;
            font-family: var(--font-display);
            font-weight: 600;
            letter-spacing: 0.12em; font-size: 0.78rem;
            border-top: 1px solid var(--border);
            opacity: 0.45;
        }

        /* ══════════════════════════════════════
           CUSTOM COLOR PICKER
        ══════════════════════════════════════ */
        .picker-overlay { position: fixed; inset: 0; z-index: 1000; display: none; }
        .picker-overlay.open { display: block; }

        .picker-panel {
            position: absolute;
            background: linear-gradient(180deg, var(--surface) 0%, #111119 100%);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius);
            padding: 18px;
            width: 264px;
            box-shadow:
                0 24px 80px rgba(0,0,0,0.7),
                0 0 0 1px rgba(255,255,255,0.04),
                0 0 40px var(--accent-glow);
            display: flex; flex-direction: column; gap: 14px;
            animation: pickerIn 0.22s var(--ease-out);
        }
        @keyframes pickerIn {
            from { opacity: 0; transform: translateY(8px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .picker-gradient {
            width: 100%; height: 168px;
            border-radius: var(--radius-sm);
            position: relative; cursor: crosshair;
            overflow: hidden; flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .picker-gradient canvas { display: block; width: 100%; height: 100%; border-radius: var(--radius-sm); }
        .picker-cursor {
            position: absolute; width: 15px; height: 15px;
            border-radius: 50%; border: 2px solid #fff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
            pointer-events: none; transform: translate(-50%,-50%);
            top: 50%; left: 50%;
        }

        .picker-hue {
            width: 100%; height: 14px;
            border-radius: 7px; position: relative; cursor: pointer;
            background: linear-gradient(to right, #f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .picker-hue-thumb {
            position: absolute; width: 18px; height: 18px;
            border-radius: 50%; background: #fff;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.5);
            top: 50%; transform: translate(-50%,-50%);
            pointer-events: none;
        }

        .picker-bottom { display: flex; gap: 10px; align-items: center; }
        .picker-preview {
            width: 40px; height: 40px; border-radius: var(--radius-sm);
            flex-shrink: 0;
            border: 1px solid var(--border-hover);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        .picker-hex-wrap { flex: 1; position: relative; display: flex; align-items: center; }
        .picker-hex-prefix {
            position: absolute; left: 11px;
            font-family: var(--font-mono);
            font-size: 0.84rem; font-weight: 400;
            color: var(--text-muted); pointer-events: none;
        }
        .picker-hex-input {
            width: 100%; padding: 9px 11px 9px 26px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            outline: none; transition: border-color 0.18s, box-shadow 0.18s;
        }
        .picker-hex-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .picker-hex-input.invalid { border-color: rgba(248,113,113,0.6); color: rgba(248,113,113,0.95); }

        .picker-btn-ok {
            padding: 9px 18px;
            background: linear-gradient(180deg, var(--accent), #6d5ce0);

            border-radius: var(--radius-sm);
            color: #fff;
            font-family: var(--font-ui);
            font-size: 0.78rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.18s var(--ease);

        }
        .picker-btn-ok:hover {
            background: linear-gradient(180deg, var(--accent-hover), #7d6af0);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        /* ══════════════════════════════════════
           BIBLIOTHÈQUE (dossier pal/)
        ══════════════════════════════════════ */
        .lib-overlay { position: fixed; inset: 0; z-index: 900; display: none; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); }
        .lib-overlay.open { display: block; }
        .lib-panel {
            position: absolute; top: 0; right: 0; height: 100%; width: 360px; max-width: 100%;
            background: linear-gradient(180deg, var(--surface) 0%, #111119 100%);
            border-left: 1px solid var(--border-hover);
            display: flex; flex-direction: column;
            box-shadow: -24px 0 80px rgba(0,0,0,0.6);
            animation: libIn 0.25s var(--ease-out);
        }
        @keyframes libIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
        .lib-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
        .lib-title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; letter-spacing: -0.02em; }
        .lib-path { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); margin-top: 4px; }
        .lib-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; line-height: 1; }
        .lib-close:hover { color: var(--text); }
        .lib-actions { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
        .lib-list { flex: 1; overflow-y: auto; padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--surface3) transparent; }
        .lib-empty { color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 30px 10px; line-height: 1.6; }
        .lib-item { position: relative; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; cursor: pointer; transition: all 0.18s var(--ease); }
        .lib-item:hover { border-color: var(--border-hover); transform: translateY(-1px); }
        .lib-item.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }
        .lib-strip { display: flex; height: 22px; border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
        .lib-strip div { flex: 1; }
        .lib-name { font-family: var(--font-display); font-weight: 500; font-size: 0.88rem; padding-right: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lib-meta { font-size: 0.62rem; color: var(--text-subtle); margin-top: 2px; letter-spacing: 0.08em; text-transform: uppercase; }
        .lib-del { position: absolute; bottom: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; opacity: 0; transition: all 0.18s; }
        .lib-item:hover .lib-del { opacity: 1; }
        .lib-del:hover { background: rgba(248,113,113,0.85); color: #fff; border-color: transparent; }
        .lib-cfg { display: flex; flex-direction: column; gap: 12px; }
        .lib-cfg label { display: flex; flex-direction: column; gap: 5px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-subtle); }
        .lib-input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; font-weight: 400; letter-spacing: 0; text-transform: none; padding: 9px 11px; outline: none; transition: border-color 0.18s, box-shadow 0.18s; }
        .lib-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .lib-help { font-size: 0.7rem; color: var(--text-muted); line-height: 1.6; }
        .lib-help a { color: var(--accent-hover); }
        .lib-help b { color: var(--text); font-weight: 600; }
        .lib-error { color: var(--danger); }
    </style>
</head>

<script>
/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let currentColors = ["#93B5C6","#A1C931","#F0CF65","#D7816A","#BD4F6C"];
let colorLabels   = {};
let colorNotes    = {};
let currentMode   = 'horizontal';
const nameCache   = {};
let paletteName   = '';
let isDirty       = false;
let fileHandle    = null;

/* ═══════════════════════════════════════════
   DOM
═══════════════════════════════════════════ */
const paletteContainer = document.getElementById('paletteContainer');
const savePaletteBtn   = document.getElementById('savePaletteBtn');
const brandingFooter   = document.getElementById('brandingFooter');
const captureArea      = document.getElementById('captureArea');
const modeToggleBtn    = document.getElementById('modeToggleBtn');
const addBtn           = document.getElementById('addBtn');
const exportBtn        = document.getElementById('exportBtn');
const importBtn        = document.getElementById('importBtn');
const importInput      = document.getElementById('importInput');
const paletteNameInput = document.getElementById('paletteNameInput');
const unsavedDot       = document.getElementById('unsavedDot');
const saveFileBtn      = document.getElementById('saveFileBtn');
const dropOverlay      = document.getElementById('dropOverlay');

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function hexToRgb(hex) {
    hex = hex.replace(/^#/,'');
    if (hex.length===3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    const n = parseInt(hex,16);
    return isNaN(n)||hex.length!==6 ? null : {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
function getTextColor(hex) {
    const c = hexToRgb(hex);
    if (!c) return '#fff';
    return (c.r*299 + c.g*587 + c.b*114)/1000 > 145 ? '#000' : '#fff';
}
function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    let h=0, s=max===0?0:d/max, v=max;
    if(d){
        switch(max){
            case r: h=(g-b)/d+(g<b?6:0); break;
            case g: h=(b-r)/d+2; break;
            case b: h=(r-g)/d+4; break;
        }
        h/=6;
    }
    return {h:h*360, s, v};
}
function hsvToHex(h,s,v){
    h/=360;
    const i=Math.floor(h*6), f=h*6-i;
    const p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
    let r,g,b;
    switch(i%6){
        case 0: r=v;g=t;b=p; break;
        case 1: r=q;g=v;b=p; break;
        case 2: r=p;g=v;b=t; break;
        case 3: r=p;g=q;b=v; break;
        case 4: r=t;g=p;b=v; break;
        case 5: r=v;g=p;b=q; break;
    }
    return '#' + [r,g,b].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function sanitizeHex(raw) {
    return raw.replace(/[^0-9a-fA-F]/g,'').slice(0,6).toUpperCase();
}
function sanitizeColorName(raw) {
    let s = raw.replace(/[\r\n\t]+/g, ' ');
    s = s.replace(/[^\p{L}\p{N}\s'&()°%/,.\-]/gu, '');
    s = s.replace(/\s+/g, ' ');
    return s.trim();
}
function isColorDuplicate(hex, excludeIndex = -1) {
    const h = hex.toUpperCase();
    return currentColors.some((c, i) => i !== excludeIndex && c.toUpperCase() === h);
}
function flashPickerDuplicate() {
    panel.style.transition = 'box-shadow 0.12s';
    panel.style.boxShadow = '0 0 0 2px rgba(248,113,113,0.8), 0 24px 80px rgba(0,0,0,0.7)';
    hexInput.classList.add('invalid');
    setTimeout(() => {
        panel.style.boxShadow = '';
        hexInput.classList.remove('invalid');
    }, 600);
}
function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            resolve();
        } catch(e) { reject(e); }
    });
}
function flashCopyBtn(btn) {
    btn.classList.add('copied');
    setTimeout(() => btn.classList.remove('copied'), 900);
}

/* ═══════════════════════════════════════════
   NOTES : colorisation des hex en live
   (calque derrière le textarea transparent)
═══════════════════════════════════════════ */
function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Éclaircit les teintes trop sombres pour rester lisibles sur fond noir,
// sans toucher aux teintes déjà claires (un jaune reste jaune).
function readableNoteColor(hex) {
    const c = hexToRgb(hex);
    if (!c) return null;
    const hsv = rgbToHsv(c.r, c.g, c.b);
    let v = hsv.v;
    if (v < 0.62) v = 0.8;
    return hsvToHex(hsv.h, hsv.s, v);
}
function highlightHexes(text) {
    return escapeHtml(text).replace(
        /#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})(?![0-9a-fA-F])/g,
        (m, hex) => {
            const col = readableNoteColor('#' + hex);
            return col ? `<span style="color:${col}">${m}</span>` : m;
        }
    );
}

/* ═══════════════════════════════════════════
   CUSTOM COLOR PICKER
═══════════════════════════════════════════ */
const overlay     = document.getElementById('pickerOverlay');
const panel       = document.getElementById('pickerPanel');
const canvas      = document.getElementById('pickerCanvas');
const cursor      = document.getElementById('pickerCursor');
const hueBar      = document.getElementById('pickerHue');
const hueThumb    = document.getElementById('pickerHueThumb');
const preview     = document.getElementById('pickerPreview');
const hexInput    = document.getElementById('pickerHexInput');
const okBtn       = document.getElementById('pickerOkBtn');
const gradient    = document.getElementById('pickerGradient');
const ctx         = canvas.getContext('2d');

let pickerHue = 0;
let pickerSat = 1;
let pickerVal = 1;
let pickerCallback = null;
let pickerEditIndex = -1;
let draggingGrad = false;
let draggingHue  = false;

function drawGradient() {
    const W = canvas.width, H = canvas.height;
    const gH = ctx.createLinearGradient(0,0,W,0);
    gH.addColorStop(0, '#fff');
    gH.addColorStop(1, hsvToHex(pickerHue,1,1));
    ctx.fillStyle = gH; ctx.fillRect(0,0,W,H);
    const gV = ctx.createLinearGradient(0,0,0,H);
    gV.addColorStop(0, 'rgba(0,0,0,0)');
    gV.addColorStop(1, '#000');
    ctx.fillStyle = gV; ctx.fillRect(0,0,W,H);
}
function resizeCanvas() {
    const rect = gradient.getBoundingClientRect();
    canvas.width  = rect.width  || 228;
    canvas.height = rect.height || 168;
    drawGradient();
    updateCursorPos();
}
function updateCursorPos() {
    const W = canvas.width, H = canvas.height;
    cursor.style.left = (pickerSat * W) + 'px';
    cursor.style.top  = ((1 - pickerVal) * H) + 'px';
}
function updateHueThumb() { hueThumb.style.left = (pickerHue / 360 * 100) + '%'; }
function updatePreview() {
    const hex = hsvToHex(pickerHue, pickerSat, pickerVal);
    preview.style.background = hex;
    hexInput.value = hex.replace('#','');
    hexInput.classList.remove('invalid');
}
function applyFromGradient(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    pickerSat = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
    pickerVal = Math.max(0, Math.min(1, 1 - (cy - rect.top) / rect.height));
    updateCursorPos();
    updatePreview();
}
function applyFromHue(e) {
    const rect = hueBar.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    pickerHue = Math.max(0, Math.min(360, (cx - rect.left) / rect.width * 360));
    drawGradient();
    updateHueThumb();
    updatePreview();
}

gradient.addEventListener('mousedown',  e => { draggingGrad=true; applyFromGradient(e); });
hueBar.addEventListener  ('mousedown',  e => { draggingHue=true;  applyFromHue(e); });
gradient.addEventListener('touchstart', e => { draggingGrad=true; applyFromGradient(e); }, {passive:true});
hueBar.addEventListener  ('touchstart', e => { draggingHue=true;  applyFromHue(e);  }, {passive:true});

window.addEventListener('mousemove', e => {
    if (draggingGrad) applyFromGradient(e);
    if (draggingHue)  applyFromHue(e);
});
window.addEventListener('mouseup',  () => { draggingGrad=false; draggingHue=false; });
window.addEventListener('touchmove', e => {
    if (draggingGrad) applyFromGradient(e);
    if (draggingHue)  applyFromHue(e);
}, {passive:true});
window.addEventListener('touchend', () => { draggingGrad=false; draggingHue=false; });

hexInput.addEventListener('input', () => {
    const clean = sanitizeHex(hexInput.value);
    if (hexInput.value !== clean) hexInput.value = clean;
    if (clean.length === 6) {
        const rgb = hexToRgb('#' + clean);
        if (rgb) {
            const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
            pickerHue = hsv.h; pickerSat = hsv.s; pickerVal = hsv.v;
            drawGradient(); updateHueThumb(); updateCursorPos();
            preview.style.background = '#' + clean;
            hexInput.classList.remove('invalid');
        }
    } else {
        hexInput.classList.add('invalid');
    }
});
hexInput.addEventListener('keydown', e => { if(e.key==='Enter') okBtn.click(); });

overlay.addEventListener('mousedown', e => {
    if (e.target === overlay) closePicker();
});

window.addEventListener('keydown', e => {
    if (e.key === 'Enter' && overlay.classList.contains('open')) {
        if (document.activeElement !== hexInput) {
            e.preventDefault();
            okBtn.click();
        }
    }
});

function openPicker(anchorEl, initialHex, callback, editIndex = -1) {
    pickerCallback = callback;
    pickerEditIndex = editIndex;
    const rgb = hexToRgb(initialHex) || {r:150,g:150,b:150};
    const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
    pickerHue = hsv.h; pickerSat = hsv.s; pickerVal = hsv.v;

    overlay.classList.add('open');
    const rect = anchorEl.getBoundingClientRect();
    const pw = 264, ph = 300;
    let top  = rect.bottom + 10;
    let left = rect.left;
    if (left + pw > window.innerWidth  - 10) left = window.innerWidth  - pw - 10;
    if (top  + ph > window.innerHeight - 10) top  = rect.top - ph - 10;
    panel.style.top  = Math.max(10, top)  + 'px';
    panel.style.left = Math.max(10, left) + 'px';

    requestAnimationFrame(() => {
        resizeCanvas();
        updateHueThumb();
        updatePreview();
    });
}

function closePicker() {
    overlay.classList.remove('open');
    pickerCallback = null;
}

okBtn.addEventListener('click', () => {
    const clean = sanitizeHex(hexInput.value);
    if (clean.length === 6 && pickerCallback) {
        const hex = '#' + clean;
        if (isColorDuplicate(hex, pickerEditIndex)) {
            flashPickerDuplicate();
            return;
        }
        pickerCallback(hex);
    }
    closePicker();
});

/* ═══════════════════════════════════════════
   COLOR API
═══════════════════════════════════════════ */
async function fetchColorName(hex) {
    const key = hex.toUpperCase().replace('#','');
    if (nameCache[key] !== undefined) return nameCache[key];
    try {
        const r = await fetch(`https://www.thecolorapi.com/id?hex=${key}&format=json`);
        const d = await r.json();
        const name = d.name?.value || hex;
        nameCache[key] = name;
        return name;
    } catch(e) {
        nameCache[key] = hex;
        return hex;
    }
}
async function loadNamesForAll() {
    const promises = currentColors.map(async (color, i) => {
        const key = color.toUpperCase().replace('#','');
        if (nameCache[key] === undefined) setNicknameEl(i, '…', true);
        const name = await fetchColorName(color);
        setNicknameEl(i, name, false);
    });
    await Promise.all(promises);
    if (currentMode === 'horizontal') requestAnimationFrame(equalizeColumns);
}
function setNicknameEl(index, text, loading) {
    const elV = document.querySelector(`.color-column[data-index="${index}"] .color-nickname`);
    if (elV) { elV.textContent = text; elV.classList.toggle('loading', loading); }
    const elH = document.querySelector(`.color-row[data-index="${index}"] .row-merged-name`);
    if (elH && !elH.classList.contains('custom')) {
        elH.textContent = text;
        elH.classList.toggle('loading', loading);
    }
}

/* ═══════════════════════════════════════════
   RENDER VERTICAL
═══════════════════════════════════════════ */
function renderVertical() {
    paletteContainer.innerHTML = '';
    const n = currentColors.length;
    captureArea.classList.toggle('many-colors',    n > 7  && n <= 12);
    captureArea.classList.toggle('too-many-colors', n > 12);
    const availH = window.innerHeight - 56;
    const padBottom = Math.max(20, Math.round(availH * 0.08));
    document.documentElement.style.setProperty('--col-pad-bottom', padBottom + 'px');

    currentColors.forEach((color, index) => {
        const key       = color.toUpperCase().replace('#','');
        const textColor = getTextColor(color);

        const col = document.createElement('div');
        col.className = 'color-column';
        col.dataset.index = index;
        col.dataset.num = String(index + 1).padStart(2, '0');
        col.style.backgroundColor = color;
        col.style.color = textColor;

        col.addEventListener('click', e => {
            if (e.target.classList.contains('color-hex') ||
                e.target.classList.contains('btn-delete-col') ||
                e.target.closest('.btn-copy-hex-v')) return;
            openPicker(col, color, hex => {
                currentColors[index] = hex.toUpperCase();
                markDirty();
                renderAll(); loadNamesForAll();
            }, index);
        });

        if (n > 1) {
            const del = document.createElement('button');
            del.className = 'btn-delete-col';
            del.innerHTML = '×';
            del.addEventListener('click', e => { e.stopPropagation(); removeColor(index); });
            col.appendChild(del);
        }

        const info = document.createElement('div');
        info.className = 'color-info';

        const hexEl = document.createElement('div');
        hexEl.className = 'color-hex';
        hexEl.contentEditable = true;
        hexEl.spellcheck = false;
        hexEl.textContent = color.toUpperCase();
        hexEl.addEventListener('input', () => {
            let raw = hexEl.textContent;
            if (!raw.startsWith('#')) raw = '#' + raw.replace(/#/g, '');
            const clean = '#' + sanitizeHex(raw.replace(/^#/, ''));
            if (hexEl.textContent !== clean) {
                hexEl.textContent = clean;
                const sel = window.getSelection();
                const range = document.createRange();
                range.selectNodeContents(hexEl);
                range.collapse(false);
                sel.removeAllRanges(); sel.addRange(range);
            }
        });
        hexEl.addEventListener('blur', () => {
            let v = hexEl.textContent.trim().replace(/^#*/,'');
            v = '#' + sanitizeHex(v);
            if (v.length === 7 && hexToRgb(v)) {
                if (!isColorDuplicate(v, index)) {
                    currentColors[index] = v.toUpperCase();
                    markDirty();
                }
            }
            renderAll(); loadNamesForAll();
        });
        hexEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); hexEl.blur(); return; }
            const sel = window.getSelection();
            const text = hexEl.textContent;
            const offset = sel.anchorOffset;
            if ((e.key === 'Backspace' || e.key === 'Delete') && text.startsWith('#')) {
                if (e.key === 'Backspace' && offset <= 1) { e.preventDefault(); return; }
                if (e.key === 'Delete' && offset === 0) { e.preventDefault(); return; }
            }
        });

        const hexRow = document.createElement('div');
        hexRow.className = 'color-hex-row';
        hexRow.appendChild(hexEl);

        const copyBtnV = document.createElement('button');
        copyBtnV.className = 'btn-copy-hex-v';
        copyBtnV.title = 'Copier le code hex';
        copyBtnV.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="8" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M3 11V3a1.5 1.5 0 011.5-1.5H10" stroke="currentColor" stroke-width="1.3"/></svg>';
        copyBtnV.addEventListener('click', e => {
            e.stopPropagation();
            copyTextToClipboard(color.toUpperCase().replace('#','')).then(() => flashCopyBtn(copyBtnV)).catch(()=>{});
        });
        hexRow.appendChild(copyBtnV);

        const nickRow = document.createElement('div');
        nickRow.className = 'color-nickname-row';

        const nameEl = document.createElement('div');
        nameEl.className = 'color-nickname' + (nameCache[key]!==undefined ? '' : ' loading');
        nameEl.textContent = nameCache[key] !== undefined ? nameCache[key] : '…';

        nickRow.appendChild(nameEl);

        info.appendChild(hexRow);
        info.appendChild(nickRow);
        col.appendChild(info);
        paletteContainer.appendChild(col);
    });
}

            + (!hasCustom && apiName === undefined ? ' loading' : '');

            range.selectNodeContents(mergedName);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
        });
        mergedName.addEventListener('paste', e => {
            e.preventDefault();
            const raw = (e.clipboardData || window.clipboardData).getData('text/plain');
            const clean = sanitizeColorName(raw);
            document.execCommand('insertText', false, clean);
        });
        mergedName.addEventListener('blur', () => {
            const val = mergedName.textContent.trim();
            const api = nameCache[key] || '';
            if (val && val !== api) {
                colorLabels[index] = val; mergedName.classList.add('custom'); markDirty();
            } else {
                delete colorLabels[index]; mergedName.classList.remove('custom');
                mergedName.textContent = api || '';
            }
        });
        mergedName.addEventListener('keydown', e => {
            if (e.key==='Enter') { e.preventDefault(); mergedName.blur(); }
            if (e.key==='Escape') {
                mergedName.textContent = colorLabels[index] || nameCache[key] || '';
                mergedName.blur();
            }
        });

        cellName.appendChild(mergedName);

        /* ── Notes : textarea + calque colorisé ── */
        const cellNotes = makeCell('Notes / Usage');

            notesHL.innerHTML = highlightHexes(notesTA.value) + '\u200b';

function makeCell(label) {
    const cell = document.createElement('div');
    cell.className = 'row-cell';
    const lbl = document.createElement('div');
    lbl.className = 'row-cell-label';
    lbl.textContent = label;
    cell.appendChild(lbl);

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function removeColor(index) {
    currentColors.splice(index, 1);
    const newL={}, newN={};
    currentColors.forEach((_,i) => {
        const o = i < index ? i : i+1;
        if (colorLabels[o] !== undefined) newL[i] = colorLabels[o];
        if (colorNotes[o]  !== undefined) newN[i] = colorNotes[o];
    });
    colorLabels = newL; colorNotes = newN;
    markDirty();
    renderAll();
}

function renderAll() {
    if (currentMode === 'vertical') renderVertical();
    else { renderHorizontal(); requestAnimationFrame(equalizeColumns); }
}

function equalizeColumns() {
    const rgbCells  = document.querySelectorAll('.row-content .row-cell:nth-child(1)');
    const nameCells = document.querySelectorAll('.row-content .row-cell:nth-child(2)');
    if (!rgbCells.length) return;
    let maxRgb=0, maxNom=0;
    rgbCells.forEach(c  => { maxRgb = Math.max(maxRgb, c.scrollWidth); });
    nameCells.forEach(c => { maxNom = Math.max(maxNom, c.scrollWidth); });
    document.querySelectorAll('.row-content').forEach(rc => {
        rc.style.gridTemplateColumns = `${maxRgb}px ${maxNom}px 1fr`;
    });
}

/* ═══════════════════════════════════════════
   EXPORT / IMPORT .palcol
═══════════════════════════════════════════ */
exportBtn.addEventListener('click', () => { exportPalcol(); });

function buildPalcolContent() {
    const lines = [String(currentColors.length)];
    if (paletteName) lines[0] += `;${paletteName}`;
    currentColors.forEach((hex, i) => {
        const name  = colorLabels[i] || nameCache[hex.replace('#','')] || '';
        const notes = (colorNotes[i] || '').replace(/\n/g,' ');
        lines.push(`"${hex}";"${name}";"${notes}"`);
    });
    return lines.join('\n');
}

function exportPalcol() {
    const content = buildPalcolContent();
    const blob = new Blob([content], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const fname = paletteName ? paletteName.replace(/[^a-zA-Z0-9_\-]/g,'_') : `palette-${Date.now()}`;
    a.download = `${fname}.palcol`;
    a.click();
    URL.revokeObjectURL(a.href);
    markClean();
}

importBtn.addEventListener('click', async () => {
    if ('showOpenFilePicker' in window) {
        try {
            const [handle] = await window.showOpenFilePicker({
                types: [{ description: 'Fichier palette', accept: {'text/plain': ['.palcol']} }],
                excludeAcceptAllOption: false
            });
            fileHandle = handle;
            const file = await handle.getFile();
            loadPalcolFile(file);
            return;
        } catch(e) {
            if (e && e.name === 'AbortError') return;
        }
    }
    fileHandle = null;
    importInput.click();
});

importInput.addEventListener('change', () => {
    const file = importInput.files[0];
    if (!file) return;
    fileHandle = null;
    loadPalcolFile(file);
    importInput.value = '';
});

function loadPalcolFile(file) {
    libCurrent = null;
    if (!file.name.toLowerCase().endsWith('.palcol')) {
        alert('Seuls les fichiers .palcol sont acceptés.');
        return;
    }
    const reader = new FileReader();
    reader.onload = e => {
        try {
            parsePalcol(e.target.result, file.name);
        } catch(err) {
            alert('Erreur import : ' + err.message);
        }
    };
    reader.readAsText(file);
}

function parsePalcol(text, fileName) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const firstParts = lines[0].split(';');
    const count = parseInt(firstParts[0]);
    if (isNaN(count)) throw new Error('Format invalide');
    const embeddedName = firstParts[1] ? firstParts[1].trim() : '';

    const newColors = [], newLabels = {}, newNotes = {};
    for (let i = 1; i <= count && i < lines.length; i++) {
        const parts = lines[i].split(';').map(p => p.replace(/^"|"$/g,''));
        const hex = parts[0] || '';
        if (!hexToRgb(hex)) continue;
        const idx = newColors.length;
        newColors.push(hex.toUpperCase());
        if (parts[1]) newLabels[idx] = parts[1];
        if (parts[2]) newNotes[idx]  = parts[2];
    }
    if (!newColors.length) throw new Error('Aucune couleur valide');
    currentColors = newColors;
    colorLabels   = newLabels;
    colorNotes    = newNotes;

    let derivedName = '';
    if (fileName) derivedName = fileName.replace(/\.palcol$/i, '').trim();
    const finalName = derivedName || embeddedName;
    if (finalName) {
        paletteName = finalName;
        paletteNameInput.value = finalName;
    }

    markClean();
    renderAll(); loadNamesForAll();
}

/* ═══════════════════════════════════════════
   DIRTY / CLEAN STATE
═══════════════════════════════════════════ */
let autoSaveTimer = null;

function markDirty() {
    isDirty = true;
    unsavedDot.classList.add('visible');
    scheduleAutoSave();
}
function markClean() {
    isDirty = false;
    unsavedDot.classList.remove('visible');
}

function scheduleAutoSave() {
    if (!fileHandle) return;
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(doAutoSave, 900);
}
async function doAutoSave() {
    if (!fileHandle || !isDirty) return;
    try {
        const writable = await fileHandle.createWritable();
        await writable.write(buildPalcolContent());
        await writable.close();
        markClean();
        flashSaveBtn('✓ Auto-sauvegardé');
    } catch(e) {}
}

window.addEventListener('beforeunload', e => {
    if (isDirty) {
        e.preventDefault();
        e.returnValue = '';
    }
});

paletteNameInput.addEventListener('input', () => {
    paletteName = paletteNameInput.value.trim();
    markDirty();
});

saveFileBtn.addEventListener('click', async () => {
    clearTimeout(autoSaveTimer);
    const content = buildPalcolContent();
    if (fileHandle) {
        try {
            const writable = await fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            markClean();
            flashSaveBtn('✓ Sauvegardé');
            return;
        } catch(e) {}
    }
    /* Token GitHub configuré : commit direct dans pal/(nom).palcol */
    if (ghCanWrite()) {
        try { if (await ghSaveCurrent()) flashSaveBtn('✓ Commit sur GitHub'); }
        catch(e) { alert('GitHub : ' + e.message); }
        return;
    }
    if ('showSaveFilePicker' in window) {
        try {
            const fname = paletteName ? paletteName.replace(/[^a-zA-Z0-9_\-]/g,'_') : 'palette';
            fileHandle = await window.showSaveFilePicker({
                suggestedName: fname + '.palcol',
                types: [{ description: 'Fichier palette', accept: {'text/plain': ['.palcol']} }]
            });
            const writable = await fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            markClean();
            flashSaveBtn('✓ Sauvegardé — les prochains changements seront auto-sauvegardés');
        } catch(e) {
            if (e.name !== 'AbortError') { exportPalcol(); }
        }
    } else {
        exportPalcol();
        flashSaveBtn('↓ Téléchargé');
    }
});

function flashSaveBtn(msg) {

    saveFileBtn.textContent = msg;
    saveFileBtn.style.borderColor = 'rgba(74,222,128,0.5)';
    saveFileBtn.style.color = '#4ade80';

}

let dragCounter = 0;

document.addEventListener('dragenter', e => {
    const hasFile = [...(e.dataTransfer?.items || [])].some(
        item => item.kind === 'file'
    );
    if (!hasFile) return;
    dragCounter++;
    dropOverlay.classList.add('active');
});
document.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); }
});
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('active');

    const dt = e.dataTransfer;
    if (!dt) return;

    const file = dt.files && dt.files[0];
    if (!file) return;

    fileHandle = null;
    loadPalcolFile(file);

    const item = dt.items && dt.items[0];
    if (item && item.kind === 'file' && item.getAsFileSystemHandle) {
        item.getAsFileSystemHandle().then(handle => {
            if (handle && handle.kind === 'file') fileHandle = handle;
        }).catch(() => {});
    }
});

/* ═══════════════════════════════════════════
   BIBLIOTHÈQUE (GitHub : dossier pal/)
═══════════════════════════════════════════ */
const libOverlay = document.getElementById('libOverlay');
const libList    = document.getElementById('libList');
const libPath    = document.getElementById('libPath');
const libBtn     = document.getElementById('libBtn');
const libSaveBtn = document.getElementById('libSaveBtn');
const libCfgBtn  = document.getElementById('libCfgBtn');

const LIB_CFG_KEY = 'akamidoriao-github';
let ghCfg      = { owner: '', repo: '', branch: '', token: '' };
let libCurrent = null;      // { name, sha } : palette ouverte depuis pal/
let libView    = 'list';    // 'list' | 'cfg'

function libLoadCfg() {
    try { Object.assign(ghCfg, JSON.parse(localStorage.getItem(LIB_CFG_KEY) || '{}')); } catch(e) {}
    // Auto-détection si l'appli est servie par GitHub Pages
    if (!ghCfg.owner && /\.github\.io$/i.test(location.hostname)) {
        ghCfg.owner = location.hostname.split('.')[0];
        const seg = location.pathname.split('/')[1];
        ghCfg.repo = (seg && !seg.includes('.')) ? seg : location.hostname;
    }
}
function libSaveCfg() {
    try { localStorage.setItem(LIB_CFG_KEY, JSON.stringify(ghCfg)); } catch(e) {}
}
function ghConfigured() { return !!(ghCfg.owner && ghCfg.repo); }
function ghCanWrite()   { return ghConfigured() && !!ghCfg.token; }

function ghHeaders(json) {
    const h = { 'Accept': 'application/vnd.github+json' };
    if (ghCfg.token) h['Authorization'] = 'Bearer ' + ghCfg.token;
    if (json) h['Content-Type'] = 'application/json';
    return h;
}
function ghUrl(path) {
    return `https://api.github.com/repos/${encodeURIComponent(ghCfg.owner)}/${encodeURIComponent(ghCfg.repo)}/contents/`
         + path.split('/').map(encodeURIComponent).join('/');
}
function ghRef() { return ghCfg.branch ? '?ref=' + encodeURIComponent(ghCfg.branch) : ''; }
function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }

async function ghErr(r) {
    let m = '';
    try { m = (await r.json()).message || ''; } catch(e) {}
    if (r.status === 403 && /rate limit/i.test(m)) return 'Limite de l’API GitHub atteinte. Ajoute un token dans les réglages.';
    if (r.status === 401) return 'Token invalide ou expiré.';
    if (r.status === 403) return 'Accès refusé : le token n’a pas le droit « Contents : Read and write » sur ce dépôt.';
    if (r.status === 404) return 'Dépôt introuvable (ou token sans accès à ce dépôt).';
    if (r.status === 409 || r.status === 422) return 'Conflit : la palette a changé sur GitHub, rouvre-la depuis la bibliothèque. (' + m + ')';
    return `GitHub ${r.status} ${m}`;
}

function libFileName(name) {
    return name.replace(/[\\/:*?"<>|]/g, '_').trim() + '.palcol';
}
function libParse(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const colors = [];
    for (let i = 1; i < lines.length; i++) {
        const hex = (lines[i].split(';')[0] || '').replace(/^"|"$/g, '');
        if (hexToRgb(hex)) colors.push(hex.toUpperCase());
    }
    return colors;
}

/* ── Lecture : liste de pal/ ── */
async function ghList() {
    const r = await fetch(ghUrl('pal') + ghRef(), { headers: ghHeaders(), cache: 'no-store' });
    if (r.status === 404) return [];
    if (!r.ok) throw new Error(await ghErr(r));
    const data = await r.json();
    return Array.isArray(data) ? data.filter(f => f.type === 'file' && /\.palcol$/i.test(f.name)) : [];
}

/* ── Écriture : commit pal/(nom).palcol ── */
async function ghSaveCurrent() {
    if (!ghCanWrite()) { libView = 'cfg'; openLib(); return false; }
    if (!paletteName) {
        paletteNameInput.focus();
        flashSaveBtn('Donne un nom à la palette');
        return false;
    }
    const fname = libFileName(paletteName);
    const path  = 'pal/' + fname;

    let sha = null;
    const g = await fetch(ghUrl(path) + ghRef(), { headers: ghHeaders(), cache: 'no-store' });
    if (g.ok) sha = (await g.json()).sha;
    else if (g.status !== 404) throw new Error(await ghErr(g));

    if (sha && !(libCurrent && libCurrent.name === fname)) {
        if (!confirm(`« ${fname} » existe déjà dans pal/. Le remplacer ?`)) return false;
    }

    const body = { message: `Palette « ${paletteName} »`, content: b64utf8(buildPalcolContent()) };
    if (sha) body.sha = sha;
    if (ghCfg.branch) body.branch = ghCfg.branch;

    const r = await fetch(ghUrl(path), { method: 'PUT', headers: ghHeaders(true), body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await ghErr(r));
    const d = await r.json();
    libCurrent = { name: fname, sha: d.content.sha };
    markClean();
    return true;
}

async function ghDelete(name, sha) {
    const body = { message: `Suppression « ${name.replace(/\.palcol$/i, '')} »`, sha };
    if (ghCfg.branch) body.branch = ghCfg.branch;
    const r = await fetch(ghUrl('pal/' + name), { method: 'DELETE', headers: ghHeaders(true), body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await ghErr(r));
}

/* ── UI ── */
function libMessage(text, isError) {
    libList.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'lib-empty' + (isError ? ' lib-error' : '');
    d.textContent = text;
    libList.appendChild(d);
}

function libDownload() {
    const blob = new Blob([buildPalcolContent()], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = libFileName(paletteName);
    a.click();
    URL.revokeObjectURL(a.href);
    markClean();
}

function renderCfg() {
    libList.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'lib-cfg';

    const intro = document.createElement('div');
    intro.className = 'lib-help';
    intro.innerHTML = 'Optionnel. <b>pal/</b> est lu en relatif, au même endroit que ce HTML. '
        + 'Renseigner le dépôt permet de lister <b>pal/</b> sans <b>index.json</b> ; le token permet d’y <b>enregistrer</b> directement (commit).';
    wrap.appendChild(intro);

    const fields = [
        ['repo',   'Dépôt (utilisateur/dépôt)', 'utilisateur/dépôt', (ghCfg.owner && ghCfg.repo) ? ghCfg.owner + '/' + ghCfg.repo : ''],
        ['branch', 'Branche (vide = par défaut)', 'main', ghCfg.branch],
        ['token',  'Token GitHub (pour enregistrer)', 'github_pat_…', ghCfg.token]
    ];
    const inputs = {};
    fields.forEach(([k, label, ph, val]) => {
        const l = document.createElement('label');
        l.textContent = label;
        const i = document.createElement('input');
        i.className = 'lib-input';
        i.type = k === 'token' ? 'password' : 'text';
        i.placeholder = ph;
        i.value = val || '';
        i.spellcheck = false;
        i.autocomplete = 'off';
        inputs[k] = i;
        l.appendChild(i);
        wrap.appendChild(l);
    });

    const help = document.createElement('div');
    help.className = 'lib-help';
    help.innerHTML = 'Token : <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained</a>, '
        + 'limité à ce dépôt, permission <b>Contents : Read and write</b>. Il reste dans le localStorage de ce navigateur.';
    wrap.appendChild(help);

    const ok = document.createElement('button');
    ok.className = 'btn btn-accent';
    ok.style.justifyContent = 'center';
    ok.textContent = 'Valider';
    ok.addEventListener('click', () => {
        const raw = inputs.repo.value.trim()
            .replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/^\/+|\/+$/g, '');
        const parts = raw.split('/');
        ghCfg.owner  = parts[0] || '';
        ghCfg.repo   = parts[1] || '';
        ghCfg.branch = inputs.branch.value.trim();
        ghCfg.token  = inputs.token.value.trim();
        libSaveCfg();
        libView = 'list';
        libRefresh();
    });
    wrap.appendChild(ok);
    libList.appendChild(wrap);
}

/* Liste des palettes : API GitHub si le dépôt est renseigné,
   sinon pal/index.json (relatif), sinon listing de dossier du serveur */
async function libListFiles() {
    if (ghConfigured()) {
        const files = await ghList();
        return files.map(f => ({
            name: f.name, sha: f.sha,
            url: f.download_url + (f.download_url.includes('?') ? '&' : '?') + 'v=' + f.sha
        }));
    }
    const t = Date.now();
    const mk = n => ({ name: n, sha: null, url: 'pal/' + encodeURIComponent(n) + '?t=' + t });

    /* Vercel : fonction api/pal.js qui renvoie les noms de fichiers de pal/ */
    try {
        const r = await fetch('api/pal?t=' + t, { cache: 'no-store' });
        if (r.ok && /json/i.test(r.headers.get('content-type') || '')) {
            const arr = await r.json();
            if (Array.isArray(arr)) {
                return arr.filter(n => typeof n === 'string' && /\.palcol$/i.test(n)).map(n => mk(n.split('/').pop()));
            }
        }
    } catch(e) {}

    try {
        const r = await fetch('pal/index.json?t=' + t, { cache: 'no-store' });
        if (r.ok) {
            const arr = await r.json();
            return (Array.isArray(arr) ? arr : [])
                .filter(n => typeof n === 'string' && /\.palcol$/i.test(n))
                .map(n => mk(n.split('/').pop()));
        }
    } catch(e) {}

    try {
        const r = await fetch('pal/', { cache: 'no-store' });
        if (r.ok && /text\/html/i.test(r.headers.get('content-type') || '')) {
            const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
            const names = [...new Set([...doc.querySelectorAll('a[href]')]
                .map(a => { try { return decodeURIComponent((a.getAttribute('href') || '').split('?')[0].split('/').pop()); } catch(e) { return ''; } })
                .filter(n => /\.palcol$/i.test(n)))];
            if (names.length) return names.map(mk);
        }
    } catch(e) {}

    throw new Error('Impossible de lister pal/ : un site statique n’expose pas le contenu d’un dossier. '
        + 'Ajoute la fonction api/pal.js (Vercel) ou pal/index.json, ou renseigne le dépôt dans Réglages.');
}

async function libRefresh() {
    libPath.textContent = ghConfigured() ? `${ghCfg.owner}/${ghCfg.repo} › pal/` : 'pal/ (relatif)';
    if (libView === 'cfg') { renderCfg(); return; }

    libMessage('Chargement…');
    let files;
    try { files = await libListFiles(); }
    catch(e) { libMessage(e.message, true); return; }

    if (!files.length) {
        libMessage('Aucune palette trouvée dans pal/. Clique sur « Enregistrer ici » pour créer la première.');
        return;
    }

    const items = await Promise.all(files.map(async f => {
        const base = { name: f.name, label: f.name.replace(/\.palcol$/i, ''), sha: f.sha, text: '', colors: [], error: '' };
        try {
            const r = await fetch(f.url);
            if (!r.ok) { base.error = 'HTTP ' + r.status; console.warn('Bibliothèque : lecture impossible', f.url, r.status); return base; }
            base.text = await r.text();
            base.colors = libParse(base.text);
            if (!base.colors.length) base.error = 'format illisible';
        } catch(e) { base.error = e.message || 'erreur réseau'; console.warn('Bibliothèque :', f.url, e); }
        return base;
    }));
    items.sort((a, b) => a.label.localeCompare(b.label, 'fr', { sensitivity: 'base' }));

    libList.innerHTML = '';
    items.forEach(it => {
        const el = document.createElement('div');
        el.className = 'lib-item' + (libCurrent && libCurrent.name === it.name ? ' current' : '');

        const strip = document.createElement('div');
        strip.className = 'lib-strip';
        it.colors.forEach(c => { const s = document.createElement('div'); s.style.background = c; strip.appendChild(s); });

        const nm = document.createElement('div');
        nm.className = 'lib-name';
        nm.textContent = it.label;

        const meta = document.createElement('div');
        meta.className = 'lib-meta';
        meta.textContent = it.error ? 'Illisible : ' + it.error
                                    : it.colors.length + ' couleur' + (it.colors.length > 1 ? 's' : '');
        if (it.error) meta.style.color = 'var(--danger)';

        el.append(strip, nm, meta);

        if (ghCanWrite() && it.sha) {
            const del = document.createElement('button');
            del.className = 'lib-del';
            del.title = 'Supprimer (commit sur GitHub)';
            del.textContent = '×';
            del.addEventListener('click', async e => {
                e.stopPropagation();
                if (!confirm(`Supprimer « ${it.label} » de pal/ ? (commit sur GitHub)`)) return;
                try {
                    await ghDelete(it.name, it.sha);
                    if (libCurrent && libCurrent.name === it.name) libCurrent = null;
                } catch(err) { alert('GitHub : ' + err.message); }
                libRefresh();
            });
            el.appendChild(del);
        }

        el.addEventListener('click', () => {
            if (it.error) return;
            fileHandle = null;
            parsePalcol(it.text, it.name);
            libCurrent = { name: it.name, sha: it.sha };
            closeLib();
        });

        libList.appendChild(el);
    });
}

function openLib() { libOverlay.classList.add('open'); libRefresh(); }
function closeLib() { libOverlay.classList.remove('open'); libView = 'list'; }

libBtn.addEventListener('click', () => { libView = 'list'; openLib(); });
document.getElementById('libClose').addEventListener('click', closeLib);
libOverlay.addEventListener('mousedown', e => { if (e.target === libOverlay) closeLib(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && libOverlay.classList.contains('open')) closeLib(); });
libCfgBtn.addEventListener('click', () => { libView = libView === 'cfg' ? 'list' : 'cfg'; libRefresh(); });
libSaveBtn.addEventListener('click', async () => {
    if (!ghCanWrite()) {
        if (!paletteName) { paletteNameInput.focus(); flashSaveBtn('Donne un nom à la palette'); return; }
        libDownload();
        flashSaveBtn('↓ À déposer dans pal/');
        return;
    }
    libSaveBtn.disabled = true;
    try {
        if (await ghSaveCurrent()) { flashSaveBtn('✓ Commit sur GitHub'); libView = 'list'; libRefresh(); }
    } catch(e) { alert('GitHub : ' + e.message); }
    libSaveBtn.disabled = false;
});
